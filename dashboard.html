<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1215"><title>SnipeLab</title><style>
:root{--bg:#0b1215;--panel:#111c20;--edge:#304247;--gold:#e9b96b;--teal:#6ed4c6;--green:#66e5ad;--red:#ff7888;--muted:#a6b8bd}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:#eef5f4;font:13px Tahoma,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.shell{max-width:950px;margin:auto;padding:12px 12px 40px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 12px}.brand{font:bold 26px Arial,sans-serif;color:var(--gold);letter-spacing:.2px}.brand-mark{color:var(--teal);font-size:29px;margin-left:8px}.uptime{border:1px solid #356e60;border-radius:12px;padding:8px 11px;min-width:132px;text-align:center;background:#112520}.uptime small{display:block;color:var(--green);font-size:10px}.uptime b{display:block;font-size:17px;direction:ltr;margin-top:4px}.uptime.offline{border-color:#8b4c53}.uptime.offline small{color:var(--red)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-left:5px}.events{border:1px solid #886b43;border-radius:12px;background:linear-gradient(120deg,#1c2424,#1a201f);padding:12px;margin-bottom:12px}.event-head{display:flex;justify-content:space-between;align-items:center;color:var(--gold);font-size:16px;font-weight:bold}.event-head button{border:1px solid #9b794a;background:#1c2221;color:var(--gold);border-radius:8px;padding:7px 12px}.event-line{display:flex;gap:10px;align-items:center;border-top:1px solid #334044;margin-top:8px;padding-top:8px;line-height:1.6}.event-line small{margin-right:auto;color:var(--muted);white-space:nowrap}.event-line .icon{color:var(--gold)}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}.summary button{background:#111d20;border:1px solid var(--edge);border-radius:11px;color:var(--muted);padding:12px 5px;min-width:0}.summary b{display:block;font-size:23px;color:#fff;margin-bottom:6px}.summary button.active{border-color:var(--gold);background:#2a281f}.search{display:block;width:100%;border:1px solid #516469;background:#121d20;color:#fff;border-radius:10px;padding:13px;margin-bottom:12px}.filters{display:flex;gap:7px;overflow-x:auto;padding:0 0 12px;scrollbar-width:thin}.filters button{white-space:nowrap;border:1px solid #3d5154;background:#142124;color:#e5f0ef;border-radius:9px;padding:10px 14px}.filters button.on{background:var(--gold);border-color:var(--gold);color:#161914;font-weight:bold}.status{font-size:11px;color:var(--muted);padding:0 2px 9px}.stocks{display:grid;grid-template-columns:1fr;gap:11px}.stock{background:linear-gradient(135deg,#132125,#10191d);border:1px solid #4a5550;border-radius:12px;padding:12px;min-width:0}.stock.ready{border-color:#4a9a79}.stock.top{border-color:#cba158;background:linear-gradient(125deg,#27271e,#142124)}.stock-top{display:flex;align-items:center;gap:12px}.sym{font:bold 21px Arial,sans-serif;color:#f6e3b5}.split-date{color:var(--muted);font-size:10px;margin-top:5px}.price-box{margin-right:auto;text-align:left}.price{font-size:20px;font-weight:bold;direction:ltr}.score{display:inline-block;color:var(--gold);font-size:11px;background:#3b321f;border-radius:7px;padding:4px 7px;margin-top:5px}.label{display:inline-block;border-radius:6px;padding:5px 8px;color:var(--teal);border:1px solid #477b79;font-size:10px;margin-top:5px}.label.ready{color:var(--green);border-color:#34795a}.label.top{color:var(--gold);border-color:#ad8645}.numbers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}.number{border:1px solid #2f4548;background:#0d181b;border-radius:7px;padding:8px 5px;text-align:center;min-width:0}.number small{display:block;font-size:10px;color:var(--muted);margin-bottom:6px}.number strong{font-size:13px;overflow-wrap:anywhere}.good{color:var(--green)}.bad{color:var(--red)}.stock details{margin-top:10px;border-top:1px solid #2e4345}.stock summary{cursor:pointer;color:var(--gold);padding:11px 3px 3px;font-size:12px}.moregrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:9px}.action{display:flex;gap:8px;margin-top:10px}.action button{flex:1;padding:10px;border-radius:7px;border:1px solid #6e8b85;background:#142b2b;color:#e9f3f1}.news{border-top:1px solid #385054;margin-top:12px;padding-top:10px}.news h3{font-size:13px;color:var(--gold);margin:0 0 8px}.news-item{display:block;color:#d6e8e5;text-decoration:none;line-height:1.7;padding:6px 0;border-bottom:1px solid #263b3e}.news-item small{display:block;color:var(--muted);font-size:10px}.news-foot{display:flex;align-items:start;gap:8px;margin-top:9px}.sentiment{padding:7px 9px;border-radius:8px;border:1px solid #49646b;color:var(--muted);white-space:nowrap}.sentiment.positive{color:var(--green);border-color:#317d60}.sentiment.negative{color:var(--red);border-color:#a44e57}.summary-ar{line-height:1.8;color:#c2d6d1;flex:1;font-size:11px}.empty{padding:22px;border:1px dashed #506064;border-radius:9px;text-align:center;color:var(--muted)}.loadmore{padding:12px;border:1px solid var(--gold);border-radius:9px;color:var(--gold);background:#25261e}.stocks>.loadmore{width:100%}.news-wait{font-size:11px;color:var(--muted);padding:8px 0}.fresh{color:var(--green)}.stale{color:var(--gold)}@media(max-width:440px){.shell{padding:9px 8px 30px}.brand{font-size:22px}.summary{gap:5px}.summary button{font-size:10px;padding:10px 3px}.summary b{font-size:20px}.number strong{font-size:12px}.numbers{gap:4px}.stock{padding:10px}.event-line small{font-size:9px}}@media(min-width:1000px){.shell{max-width:1080px}.stocks{grid-template-columns:repeat(2,minmax(0,1fr))}.stocks>.loadmore{grid-column:1/-1}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.stocks.top-mode{grid-template-columns:1fr!important}.top-card{position:relative;overflow:hidden;min-height:146px;border:1px solid #d6a646;border-radius:16px;padding:22px 18px;background:radial-gradient(circle at 10% 0%,#77531d70,transparent 42%),linear-gradient(110deg,#241d13,#111312 65%,#272012);box-shadow:inset 0 0 25px #c9972530,0 0 15px #c997251e;display:flex;align-items:center;gap:16px}.top-card:first-child{border:2px solid #ffd277;box-shadow:0 0 24px #e6aa414d,inset 0 0 20px #d4a14a30}.top-rank{font-size:23px;color:#ffd783;font-weight:900;min-width:64px;text-align:center}.top-rank span{display:block;font-size:31px}.top-content{flex:1;min-width:0;text-align:center}.top-symbol{font:900 30px Arial,sans-serif;color:#ffd57c;letter-spacing:1px}.top-gain{font:900 clamp(31px,8vw,49px) Arial,sans-serif;color:#ffd57c;direction:ltr;margin-top:9px;text-shadow:0 0 16px #e6b14c60}.top-foot{font-size:10px;color:#bda978;margin-top:9px}.top-glow{position:absolute;left:-30px;bottom:-65px;width:180px;height:100px;border-radius:50%;background:#efb94633;filter:blur(32px);pointer-events:none}@media(min-width:1000px){.stocks.top-mode{max-width:820px;margin:auto}}</style></head><body><main class="shell"><header class="head"><div class="brand"><span class="brand-mark">◎</span>SnipeLab</div><div class="uptime offline" id="uptime"><small><span class="dot"></span>جارٍ فحص السيرفر</small><b>—</b></div></header><section class="events"><div class="event-head"><span>ϟ مركز الأحداث</span><button id="eventToggle" type="button">عرض الكل ⌄</button></div><div id="eventsList" aria-live="polite"><div class="event-line">جارٍ تحميل الأحداث...</div></div></section><div class="summary"><button data-filter="all" type="button"><b id="countAll">—</b>جميع الأسهم</button><button data-filter="borrow" type="button"><b id="countBorrow">—</b>Available &lt;10K</button><button data-filter="ready" type="button"><b id="countReady">—</b>الجاهز</button><button data-filter="near" type="button"><b id="countNear">—</b>تحت الجاهزية</button></div><input id="query" class="search" type="search" placeholder="ابحث باسم السهم أو الشركة..." aria-label="البحث عن سهم"><div class="filters" role="group" aria-label="فلترة الأسهم"><button class="on" data-filter="all">الكل</button><button data-filter="ready">الجاهز</button><button data-filter="near">تحت الجاهزية</button><button data-filter="borrow">Available &lt; 10K</button><button data-filter="top">♛ توب</button></div><div id="status" class="status">جارٍ تحميل بيانات الأسهم...</div><section id="stocks" class="stocks" aria-live="polite"></section></main><script>
'use strict';
let payload={rows:{},events:[],news:{}},selected='all',limit=24,showAllEvents=false,loading=false,serverBoot=0,newsLoaded=new Set(),newsLoading=new Set();
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])),fmt=n=>n==null||!Number.isFinite(Number(n))?'—':Number(n).toLocaleString('en-US',{maximumFractionDigits:2}),money=n=>n==null||!Number.isFinite(Number(n))?'—':'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:4}),pct=n=>n==null||!Number.isFinite(Number(n))?'—':fmt(n)+'%';
const rows=()=>Object.values(payload.rows||{}).map(r=>({...r,...r.signal,q:r.price||{},b:r.borrow||{}}));
function uptime(){if(!serverBoot)return;let t=Math.max(0,Math.floor((Date.now()-serverBoot)/1000)),d=Math.floor(t/86400),h=Math.floor(t%86400/3600),m=Math.floor(t%3600/60),s=t%60;$('uptime').querySelector('b').textContent=d+'D '+[h,m,s].map(n=>String(n).padStart(2,'0')).join(':')}
function topStats(x){
 // TOP is strictly low-before-high post-split wave, never daily change
 // versus previous close. Older calculations are excluded until migrated.
 if(x.top_calculator_version<3||!x.top_10_verified||
    !Number.isFinite(x.top_10_gain_pct)||x.top_10_gain_pct<40||
    !Number.isInteger(x.top_10_sessions_since_peak)||
    x.top_10_sessions_since_peak>=10)return null;
 return {gain:x.top_10_gain_pct,provisional:!!x.top_10_provisional,
   sessions:x.top_10_sessions_since_peak};
}
function isTop(x){return topStats(x)!==null}
function badge(x){return isTop(x)?'توب':x.ready&&x.history_verified?'جاهز':x.near_ready&&x.history_verified?'تحت الجاهزية':'قيد المتابعة'}
function filtered(){let a=rows(),q=$('query').value.trim().toUpperCase();if(q)a=a.filter(x=>x.symbol.toUpperCase().includes(q)||String(x.company_name||x.name||'').toUpperCase().includes(q));if(selected==='ready')a=a.filter(x=>!isTop(x)&&x.ready&&x.history_verified);if(selected==='near')a=a.filter(x=>!isTop(x)&&x.near_ready&&x.history_verified&&!x.ready);if(selected==='borrow')a=a.filter(x=>x.b.available!=null&&x.b.available<10000);if(selected==='top')a=a.filter(isTop);a.sort((x,y)=>selected==='top'?topStats(y).gain-topStats(x).gain:(y.ready?1:0)-(x.ready?1:0)||(y.readiness_pct||0)-(x.readiness_pct||0)||(x.b.available??1e12)-(y.b.available??1e12));return a}
function topCard(x,i){const t=topStats(x);return '<article class="top-card" aria-label="'+esc(x.symbol)+' ارتفع '+esc(pct(t.gain))+'"><div class="top-rank">#'+(i+1)+'<span>'+(i===0?'♛':'♕')+'</span></div><div class="top-content"><div class="top-symbol">'+esc(x.symbol)+'</div><div class="top-gain">+'+pct(t.gain)+'</div><div class="top-foot">'+(t.provisional?'قمة تداول ممتد اليوم مقابل قاع جلسة سابقة · قراءة غير نهائية':'من قاع جلسة سابقة إلى قمة لاحقة · مرّ '+fmt(t.sessions)+' من 10 جلسات تداول بعد القمة')+'</div></div><div class="top-glow"></div></article>'}
function metric(label,value,cls=''){return '<div class="number"><small>'+esc(label)+'</small><strong class="'+cls+'">'+esc(value)+'</strong></div>'}
function card(x){let av=x.b.available,half=x.split_day_4h_high!=null?x.split_day_4h_high/2:null,low=x.history_verified?x.post_split_low:null,rank=badge(x),top=selected==='top';let news=Array.isArray(payload.news?.[x.symbol])?payload.news[x.symbol]:[];return '<article class="stock '+(x.ready?'ready':top?'top':'')+'" data-symbol="'+esc(x.symbol)+'"><div class="stock-top"><div><div class="sym">'+esc(x.symbol)+'</div><div class="split-date">التقسيم: '+esc(x.effective_date||'غير متوفر')+'</div><div class="label '+(x.ready?'ready':top?'top':'')+'">'+esc(rank)+'</div></div><div class="price-box"><div class="price">'+money(x.q.price)+'</div><div class="score">الجاهزية '+pct(x.readiness_pct)+'</div></div></div><div class="numbers">'+metric('Available',fmt(av),av!=null&&av<10000?'good':'')+metric('Rebate',pct(x.b.rebate),x.b.rebate<0?'bad':'')+metric('القاع التاريخي',money(low))+metric('بعده عن القاع',x.history_verified?pct(x.distance_from_low_pct):'—','good')+metric('نصف أعلى 4H للتقسيم',money(half))+metric('جلسات الثبات',x.stability_sessions==null?'—':fmt(x.stability_sessions)+'/4',x.stability_sessions>=4?'good':'')+'</div><details><summary>عرض بقية بيانات السهم ▾</summary><div class="moregrid">'+metric('CTB',pct(x.b.ctb))+metric('افتتاح التقسيم',money(x.split_day_open))+metric('أعلى شمعة 4H',money(x.split_day_4h_high))+metric('أعلى قمة بعد التقسيم',money(x.highest_since_split))+metric('RSI اليومي',fmt(x.rsi_daily))+metric('الشروط الناقصة',x.missing_count==null?'—':fmt(x.missing_count))+'</div><div class="action"><button type="button" data-action="chart" data-symbol="'+esc(x.symbol)+'">الشارت</button><button type="button" data-action="news" data-symbol="'+esc(x.symbol)+'">تحديث الأخبار</button></div><div class="status">'+esc(x.missing||'')+'</div></details><div class="news" id="news-'+esc(x.symbol)+'"><h3>▤ آخر أخبار السهم</h3>'+newsHtml(news,x.symbol)+'</div></article>'}
function newsHtml(items,sym){if(!items.length)return '<div class="news-wait">لا توجد أخبار موثوقة متوفرة حالياً لهذا السهم. لن نعرض ملخصاً أو تصنيفاً مختلقاً.</div>';let latest=items.slice(0,3),summary=latest.find(n=>n.summary_ar)?.summary_ar,tone=latest.find(n=>n.sentiment)?.sentiment;return latest.map(n=>'<a class="news-item" href="'+esc(n.url||'#')+'" target="_blank" rel="noopener noreferrer">'+esc(n.title_ar||n.title||'خبر')+'<small>'+esc(n.source||'')+' · '+esc(n.published_at||'')+'</small></a>').join('')+'<div class="news-foot"><div class="sentiment '+(tone==='positive'?'positive':tone==='negative'?'negative':'')+'">'+(tone==='positive'?'إيجابي':tone==='negative'?'سلبي':tone==='neutral'?'محايد':'غير مصنف')+'</div><div class="summary-ar">'+esc(summary||'الملخص العربي غير متوفر حتى يكتمل التحقق من مصدر الخبر وتحليله.')+'</div></div>'}
function render(){let all=rows(),a=filtered();$('countAll').textContent=fmt(all.length);$('countBorrow').textContent=fmt(all.filter(x=>x.b.available!=null&&x.b.available<10000).length);$('countReady').textContent=fmt(all.filter(x=>!isTop(x)&&x.ready&&x.history_verified).length);$('countNear').textContent=fmt(all.filter(x=>!isTop(x)&&x.near_ready&&x.history_verified&&!x.ready).length);document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('on',b.dataset.filter===selected));$('status').textContent=fmt(a.length)+' سهم · '+(payload.server_time?'آخر استجابة: '+new Date(payload.server_time).toLocaleTimeString('ar-SA'):'بانتظار البيانات')+' · الحقول غير المتوفرة تظهر —';let opened=[...document.querySelectorAll('.stock details[open]')].map(e=>e.closest('.stock').dataset.symbol);$('stocks').classList.toggle('top-mode',selected==='top');$('stocks').innerHTML=a.length?a.slice(0,limit).map((x,i)=>selected==='top'?topCard(x,i):card(x)).join('')+(a.length>limit?'<button type="button" class="loadmore" id="more">عرض المزيد ('+fmt(a.length-limit)+')</button>':''):'<div class="empty">لا توجد أسهم مطابقة، أو البيانات قيد التحميل.</div>';document.querySelectorAll('.stock details').forEach(d=>{if(opened.includes(d.closest('.stock').dataset.symbol))d.open=true});}
function events(){
 const allowed=new Set(['price_25','halt','available_10k','available_zero','ready']);
 const a=(payload.events||[]).filter(e=>allowed.has(e.kind))
  .filter(e=>e.kind!=='halt'||(payload.halts&&payload.halts[e.symbol]&&
    payload.halts[e.symbol]._key===(e.data?.halt_date+' '+e.data?.halt_time+' '+e.data?.reason)));
 const n=showAllEvents?a.length:3;
 const labels={price_25:e=>'ارتفع +'+fmt(e.data?.rise_pct)+'%',halt:e=>'توقف التداول الآن (HALT)',
  available_10k:e=>'الشورت المتاح أصبح '+fmt(e.data?.new)+' (10K وأقل)',
  available_zero:e=>'الشورت المتاح أصبح 0',ready:e=>'دخل قائمة الجاهزية'};
 $('eventsList').innerHTML=a.length?a.slice(0,n).map(e=>'<div class="event-line"><span class="icon">'+
  (e.kind==='halt'?'⚠':e.kind==='price_25'?'↗':e.kind==='ready'?'★':'↓')+
  '</span><span><b>'+esc(e.symbol)+'</b> · '+esc(labels[e.kind](e))+'</span><small>'+
  esc(e.at?new Date(e.at).toLocaleString('ar-SA'):'')+'</small></div>').join(''):
  '<div class="event-line">لا توجد أحداث جديدة مستوفية للشروط</div>';
 $('eventToggle').textContent=showAllEvents?'إظهار ثلاثة فقط ⌃':'عرض الكل ⌄'
}
async function fetchNews(sym,force=false){if(newsLoading.has(sym)||newsLoaded.has(sym)&&!force)return;newsLoading.add(sym);try{let r=await fetch('/api/news/'+encodeURIComponent(sym),{signal:AbortSignal.timeout(9000)});if(!r.ok)throw Error('HTTP '+r.status);let n=await r.json();payload.news??={};payload.news[sym]=n.items||[];newsLoaded.add(sym);let el=$('news-'+sym);if(el)el.innerHTML='<h3>▤ آخر أخبار السهم</h3>'+newsHtml(payload.news[sym],sym)}catch(e){let el=$('news-'+sym);if(el)el.innerHTML='<h3>▤ آخر أخبار السهم</h3><div class="news-wait">تعذر جلب الأخبار حالياً؛ جرّب لاحقاً.</div>'}finally{newsLoading.delete(sym)}}
function visibleNews(){let syms=[...document.querySelectorAll('.stock')].slice(0,6).map(e=>e.dataset.symbol);syms.forEach(sym=>fetchNews(sym))}
async function refresh(){if(loading||document.hidden)return;loading=true;try{let r=await fetch('/api/dashboard',{cache:'no-store',signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();if(!j.rows)throw Error('استجابة غير مكتملة');payload={...j,news:payload.news||{}};if(Number.isFinite(j.uptime_seconds)){serverBoot=Date.now()-j.uptime_seconds*1000;uptime()}$('uptime').classList.remove('offline');$('uptime').querySelector('small').innerHTML='<span class="dot"></span>السيرفر يعمل منذ';render();events();visibleNews()}catch(e){$('uptime').classList.add('offline');$('uptime').querySelector('small').textContent='تعذر الاتصال بالسيرفر';$('status').textContent='تعذر تحميل البيانات: '+e.message+' · أعد المحاولة';if(!Object.keys(payload.rows||{}).length)$('stocks').innerHTML='<div class="empty">تعذر تحميل البيانات. <button type="button" id="retry">إعادة المحاولة</button></div>'}finally{loading=false}}
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.filter;limit=24;render();visibleNews()}));$('query').addEventListener('input',()=>{limit=24;render();visibleNews()});$('eventToggle').addEventListener('click',()=>{showAllEvents=!showAllEvents;events()});document.addEventListener('click',e=>{if(e.target.id==='more'){limit+=24;render();visibleNews()}if(e.target.id==='retry')refresh();if(e.target.dataset.action==='news')fetchNews(e.target.dataset.symbol,true);if(e.target.dataset.action==='chart')window.open('https://www.tradingview.com/chart/?symbol='+encodeURIComponent(e.target.dataset.symbol),'_blank','noopener')});document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});setInterval(uptime,1000);setInterval(refresh,20000);refresh();
</script></body></html>
