<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>SnipeLab</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f2;color:#102635;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial;padding-bottom:64px}.w{max-width:560px;margin:auto;padding:5px 10px}.head{padding:3px 3px}.h1{display:flex;align-items:center;justify-content:space-between}.logo{font-size:17px;font-weight:950;letter-spacing:-.5px;direction:ltr}.logo:before{content:"⚡";color:#b98224;margin-right:6px}.status{display:flex;align-items:center;gap:5px;font-size:8px;color:#748188;direction:ltr}.live{color:#1c9870;font-weight:800}.uptime{font-size:9px;font-weight:900;color:#102635}.hero{text-align:right;padding:1px 2px 5px}.title{font-size:18px;font-weight:950}.sub{font-size:9px;color:#8b969a}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:3px 0 5px}.stat{background:#fff;border:1px solid #eceae4;border-radius:9px;padding:5px 3px;text-align:center;font-size:8px;box-shadow:0 2px 8px #20333d08}.stat b{display:block;font-size:14px;color:#15374a;margin-bottom:2px}.stat.gold{background:#fff8e8;border-color:#efd69d;color:#8b6218}.stat.gold b{color:#b27b18}.serverbar{background:#0d3042;color:#fff;border-radius:9px;padding:5px 8px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;text-align:center;margin-bottom:7px;font-size:7px}.serverbar b{display:block;font-size:9px;margin-top:2px}.serverbar .ok{color:#39d59b}.tools{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:6px}.search{border:1px solid #e7e5df;background:#fff;border-radius:9px;padding:9px 11px;font-size:9px;width:100%;outline:none}.filterBtn{border:0;background:#102f40;color:#fff;border-radius:9px;padding:8px 13px;font-weight:850;font-size:10px}.sortrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.sortpill{background:#fff;border:1px solid #e9e7e1;border-radius:8px;padding:6px 9px;font-size:8px;color:#56676f}.viewicons{font-size:12px;color:#45606d}.chips{display:flex;gap:4px;overflow:auto;padding-bottom:5px}.chip{font-size:7px;background:#fff;border:1px solid #e7e5df;border-radius:7px;padding:4px 6px;white-space:nowrap}.card{background:#fff;border:1px solid #ebe9e3;border-radius:10px;padding:5px 7px;margin-bottom:4px;box-shadow:0 2px 8px #20333d08;cursor:pointer}.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px;direction:rtl}.rank{width:20px;height:20px;border-radius:7px;background:#ffdda0;color:#9b6c19;display:grid;place-items:center;font-size:8px;font-weight:900}.symline{display:flex;align-items:center;justify-content:flex-start;gap:4px;direction:rtl}.sym{font-size:12px;font-weight:950}.exchange{font-size:6px;background:#edf1f3;color:#45606d;padding:2px 4px;border-radius:4px}.price{text-align:left;font-size:12px;font-weight:950;direction:ltr;min-width:54px}.chg{font-size:7px;font-weight:800;color:#24966d}.ready{font-size:7px;color:#157b58;background:#ddf7eb;border-radius:7px;padding:4px 6px;white-space:nowrap}.spark{width:48px;height:18px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #efede8;margin-top:4px;padding-top:3px}.metrics div{text-align:center;border-left:1px solid #f0eee9}.metrics div:last-child{border-left:0}.metrics small{display:block;color:#879297;font-size:6px;margin-bottom:1px}.metrics b{font-size:8px;line-height:1.05}.drawer{display:none;position:fixed;z-index:50;inset:0;background:#faf9f6;padding:16px 18px 90px;overflow:auto}.drawer.open{display:block}.drawerTitle{text-align:center;font-size:17px;font-weight:950;margin:7px 0 18px}.drawerClose{position:absolute;top:14px;left:15px;border:0;background:none;font-size:24px}.fg{padding:12px 0;border-top:1px solid #e5e3dd}.fg h4{margin:0 0 8px;font-size:11px}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.opt{border:1px solid #e2dfd7;background:#f3f2ee;border-radius:9px;padding:9px 7px;font-size:9px}.opt.on{background:#fff0ca;color:#80580f;border-color:#e2bd6e}.clear{border:0;background:#f5ead2;color:#8b631e;border-radius:9px;padding:9px 12px;margin-top:8px}.nav{position:fixed;z-index:30;bottom:0;left:0;right:0;background:#fffefaef;border-top:1px solid #e5e3dc;backdrop-filter:blur(14px)}.navin{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:none;padding:7px 2px;color:#72828a;font-size:8px}.nav button b{display:block;font-size:14px;margin-bottom:1px}.nav button.on{color:#8d6216;font-weight:900;background:#fff1cf;border-radius:10px}
.detail{display:none;position:fixed;z-index:70;inset:0;background:#f7f6f2;overflow:auto;padding:10px 12px 28px}.detail.open{display:block}.detailHead{display:flex;justify-content:space-between;align-items:center;max-width:560px;margin:0 auto 8px}.back{border:0;background:#fff;border-radius:9px;padding:7px 10px;font-size:18px}.detailInner{max-width:560px;margin:auto}.detailHero,.detailBox{background:#fff;border:1px solid #e8e6df;border-radius:12px;padding:11px;margin-bottom:8px;box-shadow:0 2px 8px #20333d08}.detailSymbol{font-size:21px;font-weight:950;direction:ltr}.detailPrice{font-size:28px;font-weight:950;direction:ltr;margin-top:6px}.detailGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#ebe9e3;border-radius:10px;overflow:hidden;margin-top:10px}.detailGrid div{background:#fff;padding:9px 3px;text-align:center}.detailGrid small{display:block;font-size:6px;color:#7d898e;margin-bottom:3px}.detailGrid b{font-size:9px}.chartMock{height:185px;border-radius:10px;background:linear-gradient(180deg,#f5f8f7,#fff);border:1px solid #ecebe6;display:flex;align-items:center;justify-content:center;color:#8c9698;font-size:9px}.strategy{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px}.check{background:#f2faf6;border-radius:9px;padding:8px 4px;text-align:center;font-size:8px}.check b{display:block;color:#239468;font-size:14px}.splitGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:9px}.splitGrid div{text-align:center}.splitGrid small{display:block;color:#849094;font-size:6px}.splitGrid b{font-size:8px}@media(min-width:650px){#cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}.card{margin:0}}
</style></head><body><div class="w"><header class="head"><div class="h1"><div class="logo">SnipeLab</div><div class="status"><span id="server" class="live">● Server</span><span id="uptime" class="uptime">0:00:00</span><span>ⓘ</span></div></div></header><section class="hero"><div class="title">أسهم التقسيم</div><div class="sub">جميع أسهم التقسيم من مايو إلى ديسمبر 2026</div></section><div class="stats"><div class="stat gold"><b id="readyCount">—</b>♛ جاهزية</div><div class="stat"><b id="nearCount">—</b>تحت الجاهزية</div><div class="stat"><b id="allCount">—</b>الكل</div><div class="stat gold"><b id="topCount">—</b>★ Top</div></div><div class="serverbar"><div>حالة السيرفر<b class="ok">● متصل</b></div><div>آخر تحديث<b id="lastUpdate">—</b></div><div>التحديث القادم<b id="nextUpdate">00:00:10</b></div></div><div class="tools"><input id="search" class="search" placeholder="ابحث عن السهم أو الرمز ..."><button id="filterBtn" class="filterBtn">☷ الفلاتر</button></div><div class="sortrow"><span class="sortpill">⌄ الترتيب: درجة الجاهزية</span><span class="viewicons">▦　♨</span></div><div id="active" class="chips"></div><div id="drawer" class="drawer"></div><div id="cards"></div></div><div id="detail" class="detail"></div><div class="nav"><div class="navin"><button class="on"><b>▥</b>أسهم التقسيم</button><button><b>♧</b>مركز الأحداث</button><button><b>▤</b>الأرشيف</button><button><b>✦</b>Snipe AI</button></div></div><script>
let d={},bootBase=0,bootSeen=Date.now(),F={rsi:null,av:null,stab:null,retest:null,float:null,cap:null,price:null};const N=v=>v==null?'—':Number(v).toLocaleString('en-US',{maximumFractionDigits:1}),P=v=>v==null?'—':Number(v).toFixed(1)+'%',D=v=>v==null?'—':'$'+Number(v).toFixed(Number(v)<1?4:2),K=v=>v==null?'—':Number(v)>=1e9?(Number(v)/1e9).toFixed(1)+'B':Number(v)>=1e6?(Number(v)/1e6).toFixed(1)+'M':Number(v)>=1e3?(Number(v)/1e3).toFixed(0)+'K':N(v);
const groups=[['rsi','RSI',[40,35,30,25,20,15]],['av','Available',[40000,30000,25000,20000,15000,10000,0]],['stab','الثبات',[2,3,4]],['retest','إعادة اختبار الدعم',['ناجح','فشل']],['float','Free Float',[2000000,1000000,500000]],['cap','Market Cap',['small','micro']],['price','Last Stock Price',[10,5,3,1.5]]];
function lab(k,v){if(k==='rsi')return v===15?'RSI < 15':'RSI < '+v;if(k==='av')return v===0?'Available = 0 🔥':'Available < '+K(v);if(k==='stab')return v+'/4';if(k==='float')return 'Float < '+K(v);if(k==='cap')return v==='small'?'Small Cap 300M–2B':'Micro Cap <300M';if(k==='price')return 'Price < $'+v;return v}
function buildFilters(){drawer.innerHTML=groups.map(g=>'<div class="fg"><h4>'+g[1]+'</h4><div class="opts">'+g[2].map(v=>'<button class="opt '+(String(F[g[0]])===String(v)?'on':'')+'" data-k="'+g[0]+'" data-v="'+v+'">'+lab(g[0],v)+'</button>').join('')+'</div></div>').join('')+'<button class="clear">مسح الكل</button>';drawer.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{let k=b.dataset.k,v=b.dataset.v;if(['rsi','av','stab','float','price'].includes(k))v=Number(v);F[k]=String(F[k])===String(v)?null:v;buildFilters();render()});drawer.querySelector('.clear').onclick=()=>{Object.keys(F).forEach(k=>F[k]=null);buildFilters();render()}}
function rows(){return Object.values(d.rows||{}).map(x=>({...x,...(x.signal||{}),q:x.price||{},br:x.borrow||{}}))}
function passes(x){let av=x.br.available??x.available,px=x.q.price??x.price,r=x.rsi_daily??x.daily_rsi,st=x.effective_sessions??0,ff=x.free_float??x.float,mc=x.market_cap;if(F.rsi!=null&&(r==null||!(r<=F.rsi)))return false;if(F.av!=null&&(av==null||(F.av===0?Number(av)!==0:!(av<F.av))))return false;if(F.stab!=null&&st<F.stab)return false;if(F.price!=null&&(px==null||!(px<F.price)))return false;if(F.float!=null&&(ff==null||!(ff<F.float)))return false;if(F.cap==='micro'&&(mc==null||mc>=3e8))return false;if(F.cap==='small'&&(mc==null||mc<3e8||mc>2e9))return false;if(F.retest&&(x.support_retest_status==null||x.support_retest_status!==F.retest))return false;return true}
function spark(x){let pts=x.sparkline||x.spark||x.price_history;if(!Array.isArray(pts)||pts.length<2)return '<span class="spark" style="display:inline-block"></span>';let a=pts.map(v=>Number(v&&typeof v==='object'?(v.close??v.price):v)).filter(Number.isFinite).slice(-18);if(a.length<2)return '<span class="spark" style="display:inline-block"></span>';let mn=Math.min(...a),mx=Math.max(...a),rg=mx-mn||1,p=a.map((v,i)=>((i/(a.length-1))*50+1)+','+(18-((v-mn)/rg)*16)).join(' '),up=a[a.length-1]>=a[0];return '<svg class="spark" viewBox="0 0 52 20"><polyline fill="none" stroke="'+(up?'#2bb98a':'#ef5c63')+'" stroke-width="1.5" points="'+p+'"/></svg>'}
function card(x){let av=x.br.available??x.available,px=x.q.price??x.price,rsi=x.rsi_daily??x.daily_rsi,st=x.effective_sessions??0,ready=x.full===true,ch=x.q.change_pct??x.change_pct,ctb=x.br.ctb??x.ctb,reb=x.br.rebate??x.rebate,ex=x.exchange||'',flag=x.country_flag||'';let state=ready?'♛ جاهز '+st+'/4':(st?st+'/4':'قيد التقييم');let chn=Number(ch),chText=Number.isFinite(chn)?((chn>0?'+':'')+chn.toFixed(2)+'%'):'';return '<div class="card" onclick="openDetail(\''+x.symbol+'\')"><div class="top"><span class="rank">'+((x._rank||0)+1)+'</span><div><div class="symline"><b class="sym">'+x.symbol+'</b>'+(ex?'<span class="exchange">'+ex+'</span>':'')+(flag?'<span>'+flag+'</span>':'')+'</div><span class="ready">'+state+'</span></div><div style="display:flex;align-items:center;justify-content:flex-end;gap:4px;direction:ltr"><div class="price">'+D(px)+'<div class="chg" style="color:'+(chn<0?'#e5535d':chn>0?'#22976d':'#879297')+'">'+chText+'</div></div>'+spark(x)+'</div></div><div class="metrics"><div><small>Available</small><b>'+K(av)+'</b></div><div><small>RSI</small><b>'+N(rsi)+'</b></div><div><small>CTB</small><b>'+(ctb==null?'—':N(ctb)+'%')+'</b></div><div><small>Rebate</small><b style="'+(Number(reb)<0?'color:#e5535d':'')+'">'+(reb==null?'—':N(reb)+'%')+'</b></div></div></div>'}
function openDetail(sym){let x=rows().find(v=>v.symbol===sym);if(!x)return;let av=x.br.available??x.available,px=x.q.price??x.price,rsi=x.rsi_daily??x.daily_rsi,st=x.effective_sessions??0,sup=x.support,dist=x.support_distance_pct,ff=x.free_float??x.float,mc=x.market_cap,ready=x.full===true;detail.innerHTML='<div class="detailHead"><button class="back" onclick="closeDetail()">‹</button><b>SnipeLab</b></div><div class="detailHero"><div class="detailSymbol">'+(x.country_flag||'')+' '+x.symbol+' <small style="font-size:10px;color:#879196">'+(x.exchange||'')+'</small></div><div class="meta">'+(x.company_name||'')+'</div><div class="detailPrice">'+D(px)+'</div><span class="ready">'+(ready?'✓ جاهز':(x.readiness_pct!=null?N(Math.min(Number(x.readiness_pct),99))+'% جاهزية':'قيد التقييم'))+'</span><div class="detailGrid"><div><small>Available</small><b>'+K(av)+'</b></div><div><small>الدعم الحالي</small><b>'+(sup==null?'—':D(sup))+'</b></div><div><small>يبعد عن الدعم</small><b>'+(dist==null?'—':P(dist))+'</b></div><div><small>RSI (Daily)</small><b>'+N(rsi)+'</b></div></div></div><div class="detailBox"><div class="chartMock">Mini Chart 4H · Extended Hours<br>يظهر بعد توصيل بيانات الشارت</div></div><div class="detailBox"><b>حالة الاستراتيجية</b><div class="strategy"><div class="check"><b>✓</b>Available<br>'+K(av)+'</div><div class="check"><b>✓</b>RSI<br>'+N(rsi)+'</div><div class="check"><b>✓</b>الثبات<br>'+st+'/4</div><div class="check"><b>'+(sup!=null?'✓':'○')+'</b>قريب من الدعم</div><div class="check"><b>'+(x.support_retest_status?'✓':'○')+'</b>إعادة اختبار الدعم</div><div class="check"><b>'+((x.half_ok||x.half_target_ok)?'✓':'○')+'</b>نص شمعة التقسيم</div></div></div><div class="detailBox"><b>الدعم وإعادة الاختبار</b><div class="detailGrid"><div><small>مستوى الدعم</small><b>'+(sup==null?'—':D(sup))+'</b></div><div><small>منذ</small><b>'+(x.support_age_sessions??'—')+' جلسات</b></div><div><small>يبعد</small><b>'+(dist==null?'—':P(dist))+'</b></div><div><small>الحالة</small><b>'+(x.support_retest_status||'—')+'</b></div></div></div><div class="detailBox"><b>بيانات السهم</b><div class="detailGrid"><div><small>Market Cap</small><b>'+K(mc)+'</b></div><div><small>Free Float</small><b>'+K(ff)+'</b></div><div><small>السعر</small><b>'+D(px)+'</b></div><div><small>CTB</small><b>'+N(x.br.ctb??x.ctb)+'</b></div></div></div><div class="detailBox"><b>بيانات التقسيم الحالية</b><div class="splitGrid"><div><small>Open</small><b>'+D(x.split_open)+'</b></div><div><small>High</small><b>'+D(x.split_high)+'</b></div><div><small>نص الشمعة</small><b>'+D(x.half_target)+'</b></div><div><small>Post-Split Low</small><b>'+D(x.post_split_low??x.effective_low)+'</b></div><div><small>Peak</small><b>'+D(x.post_split_peak??x.peak)+'</b></div></div></div>';detail.classList.add('open');document.body.style.overflow='hidden'}function closeDetail(){detail.classList.remove('open');document.body.style.overflow=''}
function render(){let q=(search?.value||'').trim().toUpperCase();let raw=rows(),a=raw.filter(x=>passes(x)&&(!q||x.symbol.includes(q)||String(x.company_name||'').toUpperCase().includes(q))).sort((a,b)=>(Number(b.readiness_pct||0)-Number(a.readiness_pct||0))||(Number(a.br.available??a.available??1e15)-Number(b.br.available??b.available??1e15)));a.forEach((x,i)=>x._rank=i);allCount.textContent=raw.length;readyCount.textContent=raw.filter(x=>x.full===true).length;nearCount.textContent=raw.filter(x=>x.full!==true&&Number(x.readiness_pct||0)>=75).length;topCount.textContent=raw.filter(x=>x.top===true).length;cards.innerHTML=a.map(card).join('')||'<div style="text-align:center;padding:30px;color:#849094">لا توجد نتائج</div>';let ac=Object.entries(F).filter(x=>x[1]!=null);active.innerHTML=ac.map(([k,v])=>'<span class="chip">'+lab(k,v)+'</span>').join('')}
async function load(){try{let r=await fetch('/api/dashboard',{cache:'no-store'});if(!r.ok)throw Error(r.status);d=await r.json();bootBase=Number(d.uptime_seconds||0);bootSeen=Date.now();server.textContent='● Server';server.className='live';lastUpdate.textContent=new Date().toLocaleTimeString('en-GB');render()}catch(e){server.textContent='● Server Offline';server.className='';}}function tick(){let s=bootBase+Math.floor((Date.now()-bootSeen)/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),q=s%60;uptime.textContent=h+':'+String(m).padStart(2,'0')+':'+String(q).padStart(2,'0')}filterBtn.onclick=()=>{drawer.classList.toggle('open');if(drawer.classList.contains('open')&&!drawer.querySelector('.drawerClose')){let t=document.createElement('div');t.className='drawerTitle';t.textContent='فلتر أسهم التقسيم';drawer.prepend(t);let b=document.createElement('button');b.className='drawerClose';b.textContent='×';b.onclick=()=>drawer.classList.remove('open');drawer.prepend(b)}};search.oninput=render;buildFilters();load();tick();setInterval(tick,1000);setInterval(load,10000);
</script></body></html>
