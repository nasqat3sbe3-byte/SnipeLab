<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>SnipeLab</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f7f3;color:#102431;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial;padding-bottom:76px}.w{max-width:760px;margin:auto;padding:10px 12px}.head{padding:10px 4px;background:transparent}.h1{display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:950;letter-spacing:-.6px}.logo:before{content:"⚡";color:#b57a18;margin-left:7px}.status{display:flex;gap:8px;align-items:center;font-size:9px;color:#69777a}.live{color:#22976d;font-weight:800}.uptime{font-size:10px;font-weight:900;color:#102431}.toolbar{display:flex;align-items:center;justify-content:space-between;margin:9px 0}.title{font-size:19px;font-weight:950}.sub{font-size:10px;color:#899296}.filterBtn{border:0;background:#102f3f;color:#fff;border-radius:10px;padding:10px 14px;font-weight:850;box-shadow:0 4px 12px #102f3f22}.chips{display:flex;gap:5px;overflow:auto;padding-bottom:7px}.chip{font-size:9px;background:#fff;border:1px solid #e7e6e1;border-radius:9px;padding:5px 8px;white-space:nowrap}.card{background:#fff;border:1px solid #ecebe6;border-radius:13px;padding:10px 11px;margin-bottom:8px;box-shadow:0 3px 12px #20333d0a;cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center}.sym{font-size:15px;font-weight:950}.meta{font-size:8px;color:#8a9296;margin-top:2px}.price{text-align:left;font-size:15px;font-weight:950}.ready{font-size:8px;color:#167956;background:#e7f8f0;border-radius:7px;padding:4px 7px;display:inline-block}.primary{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}.metric{background:#faf9f5;border-radius:8px;padding:7px 3px;text-align:center}.metric small,.secondary small{display:block;color:#899195;font-size:7px;margin-bottom:3px}.metric b{font-size:10px}.metric.hot b{color:#9b6a24}.secondary{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #f0efeb;margin-top:6px}.secondary div{text-align:center;padding:7px 2px}.secondary b{font-size:9px}.retest{margin-top:5px;border-radius:8px;padding:6px 8px;background:#edf8f2;color:#287354;font-size:8px;font-weight:850;display:flex;justify-content:space-between}.missing{margin-top:5px;font-size:8px;color:#8a6331;background:#fff6df;border-radius:7px;padding:6px 8px}.drawer{display:none;position:fixed;z-index:30;inset:0;background:#faf9f6;padding:18px 18px 95px;overflow:auto}.drawer.open{display:block}.drawer:before{content:"فلتر أسهم التقسيم";display:block;text-align:center;font-size:18px;font-weight:950;margin:10px 0 20px}.fg{padding:13px 0;border-top:1px solid #e7e5df}.fg h4{margin:0 0 9px;font-size:12px}.opts{display:flex;gap:7px;flex-wrap:wrap}.opt{border:1px solid #e2dfd7;background:#f4f3ef;border-radius:9px;padding:8px 10px;font-size:10px}.opt.on{background:#f7e6bc;color:#75500f;border-color:#e4bd6b}.clear{border:0;background:#f4ead6;color:#8d641e;border-radius:9px;padding:9px 12px}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#fffefaed;border-top:1px solid #e5e3dc;backdrop-filter:blur(14px)}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:none;padding:9px 2px;color:#75838a;font-size:9px}.nav button b{display:block;font-size:15px}.nav button.on{color:#173747;font-weight:900;background:#fff0c9;border-radius:12px}
.detail{display:none;position:fixed;z-index:40;inset:0;background:#f8f7f3;overflow:auto;padding:12px 12px 30px}.detail.open{display:block}.detailHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.back{border:0;background:#fff;border-radius:10px;padding:9px 12px;font-size:18px}.detailHero,.detailBox{background:#fff;border:1px solid #e8e6df;border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:0 3px 12px #20333d0a}.detailSymbol{font-size:24px;font-weight:950}.detailPrice{font-size:31px;font-weight:950;margin-top:8px}.detailGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#ebe9e3;border-radius:12px;overflow:hidden;margin-top:12px}.detailGrid div{background:#fff;padding:10px 3px;text-align:center}.detailGrid small{display:block;font-size:7px;color:#7d898e;margin-bottom:4px}.detailGrid b{font-size:11px}.chartMock{height:190px;border-radius:12px;background:linear-gradient(180deg,#f7f9f8,#fff);border:1px solid #ecece8;display:flex;align-items:center;justify-content:center;color:#8c9698;font-size:11px}.strategy{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.check{background:#f4faf7;border-radius:10px;padding:9px;text-align:center;font-size:9px}.check b{display:block;color:#239468;font-size:15px;margin-bottom:4px}.splitGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.splitGrid div{text-align:center}.splitGrid small{display:block;color:#849094;font-size:7px}.splitGrid b{font-size:9px}.drawerClose{position:absolute;top:18px;left:18px;border:0;background:none;font-size:23px}@media(min-width:650px){#cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{margin:0}}
</style></head><body><div class="w"><header class="head"><div class="h1"><div class="logo">Snipe<span style="color:#a98543">Lab</span></div><div class="status"><div id="server" class="live">● Server Live</div><div id="uptime" class="uptime">0:00:00</div></div></div></header>
<div class="toolbar"><div><div class="title">أسهم التقسيم</div><div id="count" class="sub">جاري تحميل البيانات...</div></div><button id="filterBtn" class="filterBtn">☷ الفلاتر</button></div><div id="active" class="chips"></div><div id="drawer" class="drawer"></div><div id="cards"></div></div><div id="detail" class="detail"></div>
<div class="nav"><div class="navin"><button class="on"><b>◈</b>أسهم التقسيم</button><button><b>◉</b>مركز الأحداث</button><button><b>▣</b>الأرشيف</button><button><b>✦</b>Snipe AI</button></div></div>
<script>
let d={},bootBase=0,bootSeen=Date.now(),F={rsi:null,av:null,stab:null,retest:null,float:null,cap:null,price:null};const N=v=>v==null?'—':Number(v).toLocaleString('en-US',{maximumFractionDigits:1}),P=v=>v==null?'—':Number(v).toFixed(1)+'%',D=v=>v==null?'—':'$'+Number(v).toFixed(Number(v)<1?4:2),K=v=>v==null?'—':Number(v)>=1e9?(Number(v)/1e9).toFixed(1)+'B':Number(v)>=1e6?(Number(v)/1e6).toFixed(1)+'M':Number(v)>=1e3?(Number(v)/1e3).toFixed(0)+'K':N(v);
const groups=[['rsi','RSI',[40,35,30,25,20,15]],['av','Available',[40000,30000,25000,20000,15000,10000,0]],['stab','الثبات',[2,3,4]],['retest','إعادة اختبار الدعم',['ناجح','فشل']],['float','Free Float',[2000000,1000000,500000]],['cap','Market Cap',['small','micro']],['price','Last Stock Price',[10,5,3,1.5]]];
function lab(k,v){if(k==='rsi')return v===15?'RSI < 15':'RSI < '+v;if(k==='av')return v===0?'Available = 0 🔥':'Available < '+K(v);if(k==='stab')return v+'/4';if(k==='float')return 'Float < '+K(v);if(k==='cap')return v==='small'?'Small Cap 300M–2B':'Micro Cap <300M';if(k==='price')return 'Price < $'+v;return v}
function buildFilters(){drawer.innerHTML=groups.map(g=>'<div class="fg"><h4>'+g[1]+'</h4><div class="opts">'+g[2].map(v=>'<button class="opt '+(String(F[g[0]])===String(v)?'on':'')+'" data-k="'+g[0]+'" data-v="'+v+'">'+lab(g[0],v)+'</button>').join('')+'</div></div>').join('')+'<button class="clear">مسح الكل</button>';drawer.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{let k=b.dataset.k,v=b.dataset.v;if(['rsi','av','stab','float','price'].includes(k))v=Number(v);F[k]=String(F[k])===String(v)?null:v;buildFilters();render()});drawer.querySelector('.clear').onclick=()=>{Object.keys(F).forEach(k=>F[k]=null);buildFilters();render()}}
function rows(){return Object.values(d.rows||{}).map(x=>({...x,...(x.signal||{}),q:x.price||{},br:x.borrow||{}}))}
function passes(x){let av=x.br.available??x.available,px=x.q.price??x.price,r=x.rsi_daily??x.daily_rsi,st=x.effective_sessions??0,ff=x.free_float??x.float,mc=x.market_cap;if(F.rsi!=null&&(r==null||!(r<=F.rsi)))return false;if(F.av!=null&&(av==null||(F.av===0?Number(av)!==0:!(av<F.av))))return false;if(F.stab!=null&&st<F.stab)return false;if(F.price!=null&&(px==null||!(px<F.price)))return false;if(F.float!=null&&(ff==null||!(ff<F.float)))return false;if(F.cap==='micro'&&(mc==null||mc>=3e8))return false;if(F.cap==='small'&&(mc==null||mc<3e8||mc>2e9))return false;if(F.retest&&(x.support_retest_status==null||x.support_retest_status!==F.retest))return false;return true}
function card(x){let av=x.br.available??x.available,px=x.q.price??x.price,rsi=x.rsi_daily??x.daily_rsi,ff=x.free_float??x.float,mc=x.market_cap,st=x.effective_sessions??0,sup=x.support,dist=x.support_distance_pct,rs=x.support_retest_status,ready=x.full===true;let score=ready?100:(x.readiness_pct==null?null:Math.min(Number(x.readiness_pct),99));let ret=rs==='ناجح'||rs==='success'?'✓ إعادة اختبار الدعم: ناجح':rs==='فشل'||rs==='failed'?'✕ إعادة اختبار الدعم: كسر وفشل':'○ إعادة اختبار الدعم: غير متاح بعد';let miss=typeof x.missing==='string'?x.missing.split(' + ')[0]:'—';return '<div class="card" onclick="openDetail(\''+x.symbol+'\')"><div class="top"><div><div class="sym">'+(x.country_flag||'')+' '+x.symbol+'</div><div class="meta">'+(x.exchange||'—')+' · Reverse Split '+(x.effective_date||'—')+(x.ratio?' · '+x.ratio:'')+'</div></div><div class="price">'+D(px)+'<br><span class="ready">'+(score==null?'—':N(score)+'%')+' جاهزية</span></div></div><div class="primary"><div class="metric hot"><small>Available</small><b>'+K(av)+'</b></div><div class="metric"><small>الدعم التاريخي</small><b>'+(sup==null?'—':D(sup))+'</b></div><div class="metric"><small>بعده عن الدعم</small><b>'+(dist==null?'—':P(dist))+'</b></div></div><div class="secondary"><div><small>RSI Daily</small><b>'+N(rsi)+'</b></div><div><small>Free Float</small><b>'+K(ff)+'</b></div><div><small>Market Cap</small><b>'+K(mc)+'</b></div><div><small>الثبات</small><b>'+st+'/4</b></div></div><div class="retest" style="'+((rs==='فشل'||rs==='failed')?'background:#f8e9e6;color:#a84d43':'')+'"><span>'+ret+'</span><span>'+(x.support_age_sessions!=null?'منذ '+x.support_age_sessions+' جلسات':'')+'</span></div>'+(!ready&&miss&&miss!=='—'?'<div class="missing">👀 باقي: '+miss+'</div>':'')+'</div>'}
function openDetail(sym){let x=rows().find(v=>v.symbol===sym);if(!x)return;let av=x.br.available??x.available,px=x.q.price??x.price,rsi=x.rsi_daily??x.daily_rsi,st=x.effective_sessions??0,sup=x.support,dist=x.support_distance_pct,ff=x.free_float??x.float,mc=x.market_cap,ready=x.full===true;detail.innerHTML='<div class="detailHead"><button class="back" onclick="closeDetail()">‹</button><b>SnipeLab</b></div><div class="detailHero"><div class="detailSymbol">'+(x.country_flag||'')+' '+x.symbol+' <small style="font-size:10px;color:#879196">'+(x.exchange||'')+'</small></div><div class="meta">'+(x.company_name||'')+'</div><div class="detailPrice">'+D(px)+'</div><span class="ready">'+(ready?'✓ جاهز':(x.readiness_pct!=null?N(Math.min(Number(x.readiness_pct),99))+'% جاهزية':'قيد التقييم'))+'</span><div class="detailGrid"><div><small>Available</small><b>'+K(av)+'</b></div><div><small>الدعم الحالي</small><b>'+(sup==null?'—':D(sup))+'</b></div><div><small>يبعد عن الدعم</small><b>'+(dist==null?'—':P(dist))+'</b></div><div><small>RSI (Daily)</small><b>'+N(rsi)+'</b></div></div></div><div class="detailBox"><div class="chartMock">Mini Chart 4H · Extended Hours<br>يظهر بعد توصيل بيانات الشارت</div></div><div class="detailBox"><b>حالة الاستراتيجية</b><div class="strategy"><div class="check"><b>✓</b>Available<br>'+K(av)+'</div><div class="check"><b>✓</b>RSI<br>'+N(rsi)+'</div><div class="check"><b>✓</b>الثبات<br>'+st+'/4</div><div class="check"><b>'+(sup!=null?'✓':'○')+'</b>قريب من الدعم</div><div class="check"><b>'+(x.support_retest_status?'✓':'○')+'</b>إعادة اختبار الدعم</div><div class="check"><b>'+((x.half_ok||x.half_target_ok)?'✓':'○')+'</b>نص شمعة التقسيم</div></div></div><div class="detailBox"><b>الدعم وإعادة الاختبار</b><div class="detailGrid"><div><small>مستوى الدعم</small><b>'+(sup==null?'—':D(sup))+'</b></div><div><small>منذ</small><b>'+(x.support_age_sessions??'—')+' جلسات</b></div><div><small>يبعد</small><b>'+(dist==null?'—':P(dist))+'</b></div><div><small>الحالة</small><b>'+(x.support_retest_status||'—')+'</b></div></div></div><div class="detailBox"><b>بيانات السهم</b><div class="detailGrid"><div><small>Market Cap</small><b>'+K(mc)+'</b></div><div><small>Free Float</small><b>'+K(ff)+'</b></div><div><small>السعر</small><b>'+D(px)+'</b></div><div><small>CTB</small><b>'+N(x.br.ctb??x.ctb)+'</b></div></div></div><div class="detailBox"><b>بيانات التقسيم الحالية</b><div class="splitGrid"><div><small>Open</small><b>'+D(x.split_open)+'</b></div><div><small>High</small><b>'+D(x.split_high)+'</b></div><div><small>نص الشمعة</small><b>'+D(x.half_target)+'</b></div><div><small>Post-Split Low</small><b>'+D(x.post_split_low??x.effective_low)+'</b></div><div><small>Peak</small><b>'+D(x.post_split_peak??x.peak)+'</b></div></div></div>';detail.classList.add('open');document.body.style.overflow='hidden'}function closeDetail(){detail.classList.remove('open');document.body.style.overflow=''}
function render(){let a=rows().filter(passes).sort((a,b)=>(Number(b.readiness_pct||0)-Number(a.readiness_pct||0))||(Number(a.br.available??a.available??1e15)-Number(b.br.available??b.available??1e15)));count.textContent=a.length+' سهم مطابق';cards.innerHTML=a.map(card).join('')||'<div class="empty">لا توجد أسهم مطابقة للفلاتر الحالية</div>';let ac=Object.entries(F).filter(x=>x[1]!=null);active.innerHTML=ac.map(([k,v])=>'<span class="chip">'+lab(k,v)+'</span>').join('')}
async function load(){try{let r=await fetch('/api/dashboard',{cache:'no-store'});if(!r.ok)throw Error(r.status);d=await r.json();bootBase=Number(d.uptime_seconds||0);bootSeen=Date.now();server.textContent='● Server Live';server.className='live';render()}catch(e){server.textContent='● Server Offline';server.className='';}}function tick(){let s=bootBase+Math.floor((Date.now()-bootSeen)/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),q=s%60;uptime.textContent=h+':'+String(m).padStart(2,'0')+':'+String(q).padStart(2,'0')}filterBtn.onclick=()=>{drawer.classList.toggle('open');if(drawer.classList.contains('open')&&!drawer.querySelector('.drawerClose')){let b=document.createElement('button');b.className='drawerClose';b.textContent='×';b.onclick=()=>drawer.classList.remove('open');drawer.prepend(b)}};buildFilters();load();tick();setInterval(tick,1000);setInterval(load,10000);
</script></body></html>
