name: SnipeLab 2 validation
on:
  push:
    branches: [snipelab-2-mobile-rebuild]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py history.py rsi.py storage.py event_rules.py low_float.py risk_evidence.py focus.py focus_study.py
      - run: python -m unittest discover -v

